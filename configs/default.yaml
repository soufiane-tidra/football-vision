# FootballVision default configuration.
# All paths are relative to the project root.

video: data/raw/match.mp4

paths:
  frames: data/processed/frames
  tracks: data/processed/tracks.csv
  calibration: data/processed/pitch_calibration.json
  homographies: data/processed/homographies.npy
  tracks_pitch: data/processed/tracks_pitch.csv
  player_metrics: data/processed/player_metrics.csv
  players: data/processed/players.csv
  ball: data/processed/ball.csv
  possession: data/processed/possession.csv
  events: data/processed/events.csv
  outputs: outputs

detection:
  model: models/football_detector.pt   # ball / goalkeeper / player / referee (scripts.train_detector)
  tracker: bytetrack.yaml
  imgsz: 1280
  conf: 0.25

frames:
  every_n_frames: 30

pitch:
  length: 105.0
  width: 68.0

movement:
  smoothing_s: 0.4
  max_speed_mps: 12.0          # faster steps are tracking errors
  min_time_on_pitch_s: 1.0
  min_on_pitch_ratio: 0.5

render:
  gif_start_s: 20.0            # README GIF: where it starts and how long it lasts
  gif_duration_s: 10.0
  gif_width: 640
  gif_fps: 7.5

pitch_keypoints:
  # Roboflow "football-field-detection" dataset (32 pitch keypoints, YOLO-pose format)
  workspace: roboflow-jvuqo
  project: football-field-detection-f07vi
  version: 12
  dataset_dir: data/datasets/pitch_keypoints
  base_model: yolo11s-pose.pt
  weights: models/pitch_keypoints.pt
  epochs: 300
  imgsz: 640
  batch: 16
  confidence: 0.5              # minimum keypoint confidence to use a point
  min_points: 6                # >4 so RANSAC has redundancy to catch a wrong point
  max_error_m: 1.0             # reject a frame if inliers disagree more than this
  smoothing_frames: 31         # temporal smoothing of homographies (~1 s): the camera moves smoothly, detections jitter

player_detection:
  # Roboflow "football-players-detection" dataset: ball, goalkeeper, player, referee
  workspace: roboflow-jvuqo
  project: football-players-detection-3zvbc
  version: 12
  dataset_dir: data/datasets/players
  base_model: yolo11s.pt
  weights: models/football_detector.pt
  epochs: 100
  imgsz: 1280                  # the ball is only a few pixels wide: high resolution matters
  batch: 6

stitching:
  max_gap_s: 3.0               # longest time a player may disappear between two fragments
  max_speed_mps: 8.0           # how far a player can move during the gap
  slack_m: 3.0                 # tolerance for calibration noise
  min_player_s: 1.0            # drop leftovers seen for less than this
  touchline_band_m: 1.5        # standing still this close to a touchline for a whole track = staff, not a player

ball:
  confidence: 0.05             # very low on purpose: false positives are removed by the trajectory search
  max_speed_px: 70.0           # largest ball displacement per frame (ball speed + camera pan)
  max_gap_frames: 30           # longest gap that is bridged / interpolated (1 s at 30 fps)
  min_segment_confidence: 0.2  # weaker continuous stretches are boots / socks, not the ball
  min_travel_m: 10.0           # a stretch that never leaves a few meters is a marking or a shoe
  static_s: 4.0                # a pitch spot holding a low-confidence 'ball' this long is a painted marking
