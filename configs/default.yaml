# FootballVision default configuration.
# All paths are relative to the project root.

video: data/raw/match.mp4

paths:
  frames: data/processed/frames
  tracks: data/processed/tracks.csv
  calibration: data/processed/pitch_calibration.json
  homographies: data/processed/homographies.npy
  tracks_pitch: data/processed/tracks_pitch.csv
  player_metrics: data/processed/player_metrics.csv
  outputs: outputs

detection:
  model: models/football_detector.pt   # ball / goalkeeper / player / referee (scripts.train_detector)
  tracker: bytetrack.yaml
  imgsz: 1280
  conf: 0.25

frames:
  every_n_frames: 30

pitch:
  length: 105.0
  width: 68.0

movement:
  smoothing_s: 0.4
  max_speed_mps: 12.0          # faster steps are tracking errors
  min_time_on_pitch_s: 1.0
  min_on_pitch_ratio: 0.5

demo:
  frames: 300                  # segment with verified calibration

pitch_keypoints:
  # Roboflow "football-field-detection" dataset (32 pitch keypoints, YOLO-pose format)
  workspace: roboflow-jvuqo
  project: football-field-detection-f07vi
  version: 12
  dataset_dir: data/datasets/pitch_keypoints
  base_model: yolo11s-pose.pt
  weights: models/pitch_keypoints.pt
  epochs: 300
  imgsz: 640
  batch: 16
  confidence: 0.5              # minimum keypoint confidence to use a point
  min_points: 6                # >4 so RANSAC has redundancy to catch a wrong point
  max_error_m: 1.0             # reject a frame if inliers disagree more than this
  smoothing_frames: 5          # temporal smoothing window for homographies

player_detection:
  # Roboflow "football-players-detection" dataset: ball, goalkeeper, player, referee
  workspace: roboflow-jvuqo
  project: football-players-detection-3zvbc
  version: 12
  dataset_dir: data/datasets/players
  base_model: yolo11s.pt
  weights: models/football_detector.pt
  epochs: 100
  imgsz: 1280                  # the ball is only a few pixels wide: high resolution matters
  batch: 6
