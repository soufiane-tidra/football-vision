name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The core (pitch, analytics, classification) does not need the heavy
      # detection stack (ultralytics / torch), so CI installs only what tests use.
      - name: Install dependencies
        run: pip install numpy opencv-python-headless pillow pyyaml matplotlib pytest ruff

      - name: Lint
        run: ruff check src scripts tests

      - name: Test
        run: pytest -v
